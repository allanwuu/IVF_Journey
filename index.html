];
const USD_TO_TWD=32; // 固定匯率：1 USD = NT$32

const groups=[['抽血檢驗','抽血檢驗'],['基因檢驗','基因檢驗'],['子宮頸抹片檢查','子宮頸抹片'],['子宮鏡／SIS 檢查','子宮鏡／SIS']];
let person='植皙';
let page='todo'; // 預設進入「待辦事項」；另外有「療程時間軸」與「費用紀錄」。
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total=n=>DATA[n].length;
const done=n=>DATA[n].filter(t=>t.done).length;
function progress(n){return `<div class="meter" role="progressbar" aria-label="${e(n)}完成進度" aria-valuemin="0" aria-valuemax="${total(n)}" aria-valuenow="${done(n)}"><span style="width:${total(n)?100*done(n)/total(n):0}%"></span></div>`;}
function tests(list){return list.map(t=>{
  const notes=Array.isArray(t.notes)?t.notes:(t.note?[t.note]:[]);
  return `<div class="test ${t.done?'done':''}">
    <span class="mark" aria-hidden="true">${t.done?'✓':''}</span>
    <div class="testinfo"><div>${e(t.name)}</div>
      ${notes.length?`<div class="testnotes">${notes.map((n,i)=>`<div class="note">備註${notes.length>1?i+1:''}｜${e(n)}</div>`).join('')}</div>`:''}
      ${t.valid?`<div class="valid">${e(t.valid)}</div>`:''}
    </div>
    <div class="planned"><span>${t.done?'完成時間':'預計時間'}</span><strong>${e(t.plannedDate|| (t.done?t.date:'待安排'))}</strong></div>
  </div>`;
}).join('');}
function sections(n){return groups.map(([g,label])=>{
 const arr=DATA[n].filter(t=>t.group===g);
 return arr.length?`<section class="group card"><h3>${e(label)} <span class="count">已完成 ${arr.filter(t=>t.done).length} / ${arr.length} 項</span></h3>${tests(arr)}</section>`:'';
}).join('');}
function personButtons(){return `<div class="switch" aria-label="選擇療程對象">${['植皙','植惇'].map(n=>`<button type="button" class="${person===n?'active':''}" aria-pressed="${person===n}" onclick="setPerson('${n}')">${n}</button>`).join('')}</div>`;}
function setPerson(n){person=n;render();}
function setPage(p){page=p;render();}
function topMenu(){return `<nav class="menu" aria-label="網站分頁">
 <button type="button" class="${page==='todo'?'active':''}" aria-current="${page==='todo'?'page':'false'}" onclick="setPage('todo')">✅ 待辦事項</button>
 <button type="button" class="${page==='timeline'?'active':''}" aria-current="${page==='timeline'?'page':'false'}" onclick="setPage('timeline')">🧡 療程時間軸</button>
 <button type="button" class="${page==='expenses'?'active':''}" aria-current="${page==='expenses'?'page':'false'}" onclick="setPage('expenses')">💰 費用紀錄</button>
 </nav>`;}
function timelinePage(n){const arr=TIMELINES[n]||[];
 return `<div class="eyebrow">${e(n)} / TIMELINE</div>
 <h2 style="font-size:19px;margin:8px 0 2px">${e(n)}的療程時間軸</h2>
 ${arr.length?`<div class="timeline-list">${arr.map(x=>`<article class="timeline-entry"><div class="timeline-date">${e(x.date)}</div><div><h3>${e(x.title)}</h3><p>${e(x.detail)}</p><span class="timeline-status ${x.status==='進行中'?'ongoing':''}">${e(x.status)}</span></div></article>`).join('')}</div>`:'<div class="card empty" style="margin-top:16px">尚未新增療程紀錄</div>'}`;
}
function expenseTotal(currency,who){return EXPENSES.filter(x=>x.currency===currency&&(!who||x.person===who)).reduce((s,x)=>s+Number(x.amount),0);}
function expenseMoney(n,currency){return (currency==='TWD'?'NT$':'US$')+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}
function expensesPage(){return `
 <div class="eyebrow">OUR JOURNEY / EXPENSES</div>
 <div class="expense-intro"><div><h1 class="title">費用紀錄</h1><p class="sub">療程費用記錄，保留原始幣別與費用歸屬。</p></div></div>
 ${topMenu()}
 <div class="expense-meta"><h2>費用明細</h2><span class="muted">共 ${EXPENSES.length} 筆・依日期排列</span></div>
 <div class="expense-list">
 <div class="expense-row head"><span>日期</span><span>項目／備註</span><span>費用歸屬</span><span>幣別</span><span style="text-align:right">金額</span></div>
 ${[...EXPENSES].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="expense-row"><span class="expense-date">${e(x.date.slice(5).replace('-','/'))}</span><div class="expense-desc"><div class="expense-title">${e(x.item)}</div>${x.note?`<div class="expense-note">${e(x.note)}</div>`:''}</div><span class="owner ${x.person==='植惇'?'dun':''}">${e(x.person)}</span><span class="curr">${x.currency==='TWD'?'新台幣 TWD':'美元 USD'}</span><span class="money">${expenseMoney(x.amount,x.currency)}</span></div>`).join('')}
 </div>
 <section class="expense-summary">
  <div class="eyebrow">SUMMARY</div><h2>費用統計</h2><p class="sub">台幣與美元分開加總；美元另依固定匯率換算新台幣。</p>
  <div class="summary-cards">
   <div class="summary-card"><div class="label">台幣支出合計</div><strong>${expenseMoney(expenseTotal('TWD'),'TWD')}</strong><small>${EXPENSES.filter(x=>x.currency==='TWD').length} 筆費用</small></div>
   <div class="summary-card usd"><div class="label">美元支出合計</div><strong>${expenseMoney(expenseTotal('USD'),'USD')}</strong><small>${EXPENSES.filter(x=>x.currency==='USD').length} 筆費用</small><div class="fx-conversion"><span>換算新台幣</span><b>${expenseMoney(expenseTotal('USD')*USD_TO_TWD,'TWD')}</b><small>固定匯率：1 USD = NT$${USD_TO_TWD}</small></div></div>
  </div>
  <h3 style="font-size:15px;margin:26px 0 12px">依費用歸屬統計</h3>
  <div class="breakdown"><div class="breakdown-row"><span>費用歸屬</span><span>台幣（TWD）</span><span>美元（USD）</span></div>
    ${['植皙','植惇'].map(n=>`<div class="breakdown-row"><strong>${e(n)}</strong><span>${expenseMoney(expenseTotal('TWD',n),'TWD')}</span><span>${expenseMoney(expenseTotal('USD',n),'USD')}</span></div>`).join('')}
  </div>
  <div class="summary-foot">※ 美元換算採固定匯率 1 USD = NT$${USD_TO_TWD}，非即時匯率。換算值僅供參考，不會重複計入上方的台幣支出。</div>
 </section>`;
}
function render(){const root=document.getElementById('preview');
 if(page==='expenses'){root.innerHTML=expensesPage();return;}
 root.innerHTML=`
 <div class="eyebrow">OUR JOURNEY / OVERVIEW</div><h1 class="title">偉大的航道—療程總覽</h1>
 <p class="sub">一眼掌握植皙與植惇的進度</p>
 <div class="grid2" style="margin-top:25px">${['植皙','植惇'].map(n=>`<div class="card"><div class="eyebrow">${n} / CHECKLIST</div><div class="stat">${done(n)} <small style="font-size:14px">/ ${total(n)}</small></div><div class="muted" style="font-size:13px">已完成檢查・${Math.round(100*done(n)/total(n))}%</div>${progress(n)}<button type="button" class="back" style="margin-top:18px" onclick="setPerson('${n}')">查看${n}的項目 →</button></div>`).join('')}</div>
 ${topMenu()}${personButtons()}
 ${page==='timeline'?timelinePage(person):sections(person)}`;
}
render();
</script></body></html>
