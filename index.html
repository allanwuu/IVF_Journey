<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf3fb">
<title>IVF Journey｜療程進度紀錄</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f9fc;color:#29445d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.6}header{background:white;border-bottom:1px solid #e5edf3;position:sticky;top:0;z-index:2}.bar{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:15px 20px}.logo{font-size:19px;font-weight:800;color:#3178ae;cursor:pointer}button{font:inherit;cursor:pointer}.toplink{border:0;background:#edf5fc;color:#3679ab;padding:8px 13px;border-radius:11px;font-weight:700}main{max-width:1000px;margin:28px auto;padding:0 18px 50px}.hero{background:linear-gradient(115deg,#e2f1fd,#fff6eb);border-radius:24px;padding:27px 28px;margin-bottom:20px}.eyebrow{font-size:13px;color:#387db2;font-weight:700}h1{font-size:clamp(24px,4vw,34px);margin:5px 0}h2{font-size:19px;margin:0}p{margin:5px 0;color:#6d8091}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card,.section{background:white;border:1px solid #e5edf3;border-radius:20px;padding:20px;box-shadow:0 5px 18px #304c6310}.navcard{text-align:left;color:inherit;transition:transform .15s}.navcard:hover{transform:translateY(-2px)}.navcard .emoji{font-size:27px}.navcard h2{margin:8px 0 2px}.navcard small{color:#6d8091}.section{margin-top:17px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:#edf4fa;color:#47799c;white-space:nowrap}.progress{height:10px;border-radius:20px;background:#e7eef4;overflow:hidden;margin:13px 0 5px}.progress>div{height:100%;background:linear-gradient(90deg,#75b9e5,#eeb279)}.list{list-style:none;margin:0;padding:0}.item{display:flex;align-items:flex-start;gap:12px;border-top:1px solid #edf1f5;padding:12px 0}.item:first-child{border-top:0}.check{width:23px;height:23px;flex:none;border:2px solid #c7d6e2;border-radius:7px;display:grid;place-items:center;color:white;margin-top:1px}.item.done .check{background:#60a98c;border-color:#60a98c}.item.done .check:after{content:'✓';font-weight:bold}.itemmain{flex:1;min-width:0}.itemname{font-weight:650}.item.done .itemname{color:#718b7d}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.tag{font-size:12px;padding:2px 8px;border-radius:7px;background:#f1f5f8;color:#60798d}.tag.purple{background:#f7e9fa;color:#a13caa}.tag.yellow{background:#fff4d5;color:#9b741b}.tag.red{background:#ffe9e8;color:#b94d4b}.status{font-size:12px;color:#8093a2;white-space:nowrap}.item.done .status{color:#468b71}.timeline{border-left:3px solid #f1c8a3;margin:12px 0 0 10px;padding-left:22px}.event{position:relative;padding:0 0 23px}.event:before{content:'';position:absolute;left:-31px;top:5px;background:#e6a36a;width:15px;height:15px;border:3px solid white;border-radius:50%;box-shadow:0 0 0 2px #f1c8a3}.event h3{margin:0;font-size:16px}.event .date{font-size:13px;color:#b37b4d;font-weight:700}.event p{font-size:14px}.note{background:#fff8ec;padding:13px 16px;border-radius:12px;font-size:13px;color:#8a7150;margin-top:16px}.footer{text-align:center;color:#95a6b2;font-size:12px;margin:32px 0}@media(max-width:580px){.cards{grid-template-columns:1fr}.hero{padding:23px 20px}.card,.section{padding:17px}.bar{padding:12px 16px}.status{font-size:11px}}</style></head>
<body><header><div class="bar"><div class="logo" onclick="go('home')">🌷 IVF Journey</div><button class="toplink" onclick="go('home')">⌂ 返回首頁</button></div></header><main id="app"></main>
<script>
/* 修改檢查進度：done: true 表示已完成；date 為檢查日期；note 為備註。
   所有資料只在 GitHub 修改，網站本身沒有編輯功能。 */
const DATA={
"植皙":{tests:[
{"group": "抽血檢驗", "name": "血型、Rh 型", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "血液分析 CBC w/Diff & Plat", "valid": "一年內報告有效", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "抗穆勒氏管荷爾蒙 AMH", "valid": "一年內報告有效", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "B 型肝炎表面抗原 HBsAg", "valid": "一年內報告有效", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "C 型肝炎抗體 HCV", "valid": "一年內報告有效", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "HIV 抗原／抗體", "valid": "一年內報告有效", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "梅毒 RPR", "valid": "一年內報告有效", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "披衣菌 Chlamydia（NAA/TMA/DNA）", "valid": "一年內報告有效", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "淋病 Gonorrhea（NAA/TMA/DNA）", "valid": "一年內報告有效", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "B 型肝炎核心抗體 HBcAb（with reflex to IgM）", "valid": "一年內報告有效", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "促甲狀腺激素 TSH", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "游離型甲狀腺素 Free T4", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "泌乳激素 Prolactin", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "巨細胞病毒 IgG（CMV IgG）", "valid": "使用捐贈精／卵時建議檢驗", "done": false, "date": "", "note": ""},
{"group": "基因檢驗", "name": "隱性基因帶因篩檢（280 項）", "valid": "使用捐贈精／卵時建議檢驗", "done": false, "date": "", "note": ""},
{"group": "子宮頸抹片檢查", "name": "子宮頸抹片檢查 Pap smear", "valid": "三年內報告有效", "done": false, "date": "", "note": ""},
{"group": "子宮鏡／SIS 檢查", "name": "子宮鏡攝影（Hysteroscopy）或鹽水注射超音波檢查（SIS）", "done": false, "date": "", "note": "月經剛結束的時候檢查"}
],timeline:[]},
"植惇":{tests:[
{"group": "抽血檢驗", "name": "血液分析 CBC w/Diff & Plat", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "抗體篩檢 AB screening", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "水痘抗體 Varicella IgG", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "德國麻疹抗體 Rubella IgG", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "B 型肝炎表面抗原 HBsAg", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "C 型肝炎抗體 HCV", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "HIV 抗原／抗體", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "梅毒 RPR", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "披衣菌 Chlamydia（NAA/TMA/DNA）", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "淋病 Gonorrhea（NAA/TMA/DNA）", "done": false, "date": "", "note": ""},
{"group": "抽血檢驗", "name": "B 型肝炎核心抗體 HBcAb（with reflex to IgM）", "done": false, "date": "", "note": ""},
{"group": "子宮頸抹片檢查", "name": "子宮頸抹片檢查 Pap smear", "done": false, "date": "", "note": ""},
{"group": "子宮鏡／SIS 檢查", "name": "子宮鏡攝影（Hysteroscopy）或鹽水注射超音波檢查（SIS）", "done": false, "date": "", "note": "月經剛結束的時候檢查"}
],timeline:[]}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=[['抽血檢驗','🩸'],['基因檢驗','🧬'],['子宮頸抹片檢查','🌼'],['子宮鏡／SIS 檢查','🏥']];
function go(page){location.hash=page==='home'?'home':encodeURIComponent(page);render();window.scrollTo(0,0)}
function home(){return `<div class="hero"><div class="eyebrow">OUR IVF JOURNEY</div><h1>🌷 我們的療程紀錄</h1><p>待辦事項與療程時間軸，一起掌握每一步。</p></div><div class="cards">${['植皙','植惇'].map(n=>`<button class="card navcard" onclick="go('${n}-todo')"><div class="emoji">✅</div><h2>${n}－待辦事項</h2><small>查看檢查清單與完成進度 →</small></button><button class="card navcard" onclick="go('${n}-timeline')"><div class="emoji">🧡</div><h2>${n}－療程進度時間軸</h2><small>查看回診與療程重要日期 →</small></button>`).join('')}</div>`}
function todo(name){const tests=DATA[name].tests;const completed=tests.filter(t=>t.done).length;const pct=tests.length?Math.round(completed/tests.length*100):0;return `<div class="hero"><div class="eyebrow">IVF JOURNEY / ${name}</div><h1>✅ ${name}－待辦事項</h1><p>檢查準備清單與目前完成狀態</p><div class="progress"><div style="width:${pct}%"></div></div><p><strong>${completed} / ${tests.length}</strong> 項完成・${pct}%</p></div>${groups.map(([g,icon],i)=>{const arr=tests.filter(t=>t.group===g);if(!arr.length)return '';return `<section class="section"><div class="section-title"><h2>${icon} ${String(i+1).padStart(2,'0')} ${g}</h2><span class="pill">${arr.filter(t=>t.done).length} / ${arr.length}</span></div><ul class="list">${arr.map(t=>`<li class="item ${t.done?'done':''}"><span class="check"></span><div class="itemmain"><div class="itemname">${esc(t.name)}</div><div class="meta">${t.valid?`<span class="tag ${t.valid.startsWith('一年')?'purple':t.valid.startsWith('三年')?'yellow':'red'}">${esc(t.valid)}</span>`:''}${t.date?`<span class="tag">📅 ${esc(t.date)}</span>`:''}${t.note?`<span class="tag">📝 ${esc(t.note)}</span>`:''}</div></div><span class="status">${t.done?'已完成':'未完成'}</span></li>`).join('')}</ul></section>`}).join('')}<div class="note">檢查項目與報告效期依提供的診所清單整理；實際適用性及效期以診所最新規定為準。</div>`}
function timeline(name){const arr=DATA[name].timeline;return `<div class="hero"><div class="eyebrow">IVF JOURNEY / ${name}</div><h1>🧡 ${name}－療程進度時間軸</h1><p>記錄每一個重要階段</p></div><section class="section"><div class="section-title"><h2>📅 療程紀錄</h2><span class="pill">${arr.length} 筆</span></div>${arr.length?`<div class="timeline">${arr.map(e=>`<div class="event"><div class="date">${esc(e.date)}</div><h3>${esc(e.title)}</h3>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`).join('')}</div>`:'<p>尚未新增療程紀錄，之後會依日期顯示於此。</p>'}</section>`}
function render(){let id=decodeURIComponent((location.hash||'#home').slice(1));let m=id.match(/^(植皙|植惇)-(todo|timeline)$/);document.getElementById('app').innerHTML=m?(m[2]==='todo'?todo(m[1]):timeline(m[1])):home();document.title=(m?`${m[1]}－${m[2]==='todo'?'待辦事項':'療程進度時間軸'}｜`:'')+'IVF Journey'}
window.addEventListener('hashchange',render);render();
</script><div class="footer">IVF Journey · 用心記錄每一步</div></body></html>
